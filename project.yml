# XcodeGen manifest for the signed mac++.app. Regenerate the (git-ignored) .xcodeproj with:
#   xcodegen generate
# The app reuses the package's MacPlusPlusKit library, so `swift run mac-plus-plus` and the .app share every line.
name: MacPlusPlus
options:
  bundleIdPrefix: com.jgray
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  MacPlusPlus:
    path: .

targets:
  MacPlusPlus:
    type: application
    platform: macOS
    sources:
      - path: App
        # Xcode builds the icon from AppIcon.icon; the .icns is for the SwiftPM-built bundle.
        excludes: ["AppIcon.icns", "AppIcon.icon"]
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: MacPlusPlus
        product: MacPlusPlusKit
    settings:
      base:
        PRODUCT_NAME: mac++
        PRODUCT_MODULE_NAME: MacPlusPlusApp
        PRODUCT_BUNDLE_IDENTIFIER: com.jgray.mac-plus-plus
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES            # menu-bar only, no Dock icon
        INFOPLIST_KEY_CFBundleDisplayName: "mac++"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  MacPlusPlus:
    build:
      targets:
        MacPlusPlus: all
    run:
      config: Debug
